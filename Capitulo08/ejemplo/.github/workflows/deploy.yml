name: Construir y desplegar la app Vue          # Nombre del flujo; es lo que se ve en la pestaña Actions de GitHub
on:                                              # Aqui se declara que hechos ponen en marcha este flujo
  push:                                          # Se pone en marcha cuando alguien sube commits al repositorio
    branches: [main]                             # Pero solo si esos commits llegan a la rama main
  workflow_dispatch:                             # Y ademas deja lanzarlo a mano con un boton desde GitHub
permissions:                                     # Permisos que GitHub le presta a este flujo mientras corre
  contents: read                                 # Puede leer el codigo del repositorio, nada mas
  pages: write                                   # Puede publicar el sitio en GitHub Pages
  id-token: write                                # Puede pedir un token temporal que prueba su identidad al publicar
concurrency:                                     # Regla para que no se encimen dos despliegues al tiempo
  group: pages                                   # Todos los despliegues hacen fila en el mismo turno llamado pages
  cancel-in-progress: true                       # Si llega uno nuevo, se cancela el que iba corriendo
jobs:                                            # Lista de trabajos; aqui son dos, construir y publicar
  build:                                         # Primer trabajo, arma los archivos finales de la aplicacion
    runs-on: ubuntu-latest                       # Corre dentro de un computador Linux que GitHub presta por unos minutos
    steps:                                       # Pasos que ese trabajo ejecuta, en orden y de arriba hacia abajo
      - uses: actions/checkout@v7                # Descarga el codigo del repositorio dentro de ese computador prestado
      - uses: actions/setup-node@v7              # Instala Node.js, que es el programa que sabe compilar la app
        with:                                    # Opciones para el paso anterior
          node-version: 22                       # Fija la version 22 de Node para que hoy y en un anio compile igual
          cache: npm                             # Guarda las librerias descargadas para que la proxima vez sea mas rapido
      - run: npm ci                              # Instala las librerias exactamente como dice package-lock.json, sin improvisar
      - run: npm run lint                        # Revisa estilo y errores del codigo; si algo falla, el flujo se detiene aqui
      - run: npm run type-check                  # Verifica los tipos con vue-tsc y atrapa errores antes de compilar
      - run: npm run test:unit -- --run          # Corre las pruebas unitarias una sola vez, sin quedarse esperando cambios
      - run: npm run build                       # Compila la aplicacion; Vite deja los archivos listos en la carpeta dist
        env:                                     # Variables que recibe ese comando de compilacion
          VITE_API_URL: ${{ vars.VITE_API_URL }} # Direccion del backend, tomada de la configuracion del repositorio
          VITE_APP_VERSION: ${{ github.sha }}    # Identificador del commit, para saber despues que version esta publicada
      - uses: actions/upload-pages-artifact@v5   # Empaqueta lo compilado y se lo entrega al siguiente trabajo
        with:                                    # Opciones del empaquetado
          path: dist                             # La carpeta que se empaqueta es dist, la que acaba de producir Vite
  deploy:                                        # Segundo trabajo, publica en internet lo que armo el primero
    needs: build                                 # No arranca hasta que build termine bien; si build falla, no se publica nada
    runs-on: ubuntu-latest                       # Tambien corre en un computador Linux prestado por GitHub
    environment:                                 # Declara a que entorno se publica, para dejar rastro y poder exigir aprobacion
      name: github-pages                         # El entorno se llama github-pages
      url: ${{ steps.deployment.outputs.page_url }} # GitHub muestra aqui la direccion publica ya publicada
    steps:                                       # Pasos del trabajo de publicacion
      - id: deployment                           # Se le pone un nombre corto al paso para poder leer su resultado arriba
        uses: actions/deploy-pages@v5            # Toma el paquete que dejo build y lo pone en linea en GitHub Pages
